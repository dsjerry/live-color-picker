name: Build Android

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - apk
          - appbundle
        default: apk
      app-version:
        description: 'App version name (for example, 1.2.3)'
        required: true
        type: string
        default: '1.0.0'
      build-number:
        description: 'Android build number; leave blank to use the workflow run number'
        required: false
        type: string

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Resolve and validate version
        id: version
        env:
          APP_VERSION: ${{ inputs.app-version }}
          BUILD_NUMBER_INPUT: ${{ inputs.build-number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::App version must use semantic version format, such as 1.2.3."
            exit 1
          fi

          BUILD_NUMBER="$BUILD_NUMBER_INPUT"
          if [[ -z "$BUILD_NUMBER" ]]; then
            BUILD_NUMBER="$RUN_NUMBER"
          fi
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || (( BUILD_NUMBER > 2100000000 )); then
            echo "::error::Build number must be a positive integer no greater than 2100000000."
            exit 1
          fi

          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build APK
        if: ${{ inputs.build-type == 'apk' }}
        env:
          APP_VERSION: ${{ inputs.app-version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: flutter build apk --release --split-per-abi --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"

      - name: Build AppBundle
        if: ${{ inputs.build-type == 'appbundle' }}
        env:
          APP_VERSION: ${{ inputs.app-version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: flutter build appbundle --release --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.app-version }}+${{ steps.version.outputs.build-number }}
          name: 'Android ${{ inputs.build-type }} — v${{ inputs.app-version }}+${{ steps.version.outputs.build-number }}'
          files: |
            ${{ inputs.build-type == 'apk' && 'build/app/outputs/flutter-apk/app-*-release.apk' || 'build/app/outputs/bundle/release/app-release.aab' }}
